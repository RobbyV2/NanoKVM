name: NanoKVM Tests

# The gate. package.yml builds the artifact but runs nothing, so before this
# existed every test in the tree ran only when a human remembered to, including
# the twenty golden traces in server/service/presentation/testdata that are the
# entire acceptance criteria for the gadget refactor.
#
# No paths filter: a required check that is skipped on some pull requests never
# reports at all, and people wait on this one.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: gofmt
        working-directory: server
        run: |
          # gofmt -l exits 0 whether or not it listed anything, so the exit code
          # has to be built here.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: server
        # Every package, picoclaw and ws included: vet type-checks and compiles
        # but never links, so the riscv64 libkvm.so the two of them need at link
        # time is not reached here.
        run: go vet ./...

      # The ten test files in service/picoclaw and service/ws have never run in
      # any environment, and the reason deserves more than "cgo".
      #
      # They cross-compile: "go test -c" for riscv64 inside the builder image
      # produces working test binaries. Those binaries also start under
      # qemu-riscv64 with server/dl_lib and the toolchain's libstdc++, libgomp,
      # libgcc_s and libatomic on LD_LIBRARY_PATH. What stops them there is
      # libopencv_video.so.409: libkvm.so lists it in DT_NEEDED and it exists
      # neither in this repository nor in the builder image, only on the device
      # rootfs. The one machine these tests can run on is a NanoKVM.
      #
      # The alternative is a stub libkvm.so that satisfies the linker, which
      # stops being honest the day someone writes a test that reaches the video
      # path. So they stay unrun, and the step below keeps count of exactly
      # which packages that is.
      - name: Resolve testable packages
        id: packages
        working-directory: server
        run: |
          # NanoKVM-Server/common carries "#cgo LDFLAGS: -L../dl_lib -lkvm", and
          # dl_lib/libkvm.so is a riscv64 shared object, so ld on this runner
          # skips it as incompatible and any test binary that reaches common
          # fails to link. Derive that set from the import graph rather than
          # naming packages: a new package with tests that reaches common would
          # otherwise turn this job red with no explanation, and a package that
          # stops reaching it would stay silently excluded.
          blocked=$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{$p := .ImportPath}}{{range .Deps}}{{if eq . "NanoKVM-Server/common"}}{{$p}}{{end}}{{end}}{{end}}' ./... \
            | grep -v '^$' | LC_ALL=C sort)
          expected=$(printf '%s\n' \
            NanoKVM-Server/service/picoclaw \
            NanoKVM-Server/service/ws | LC_ALL=C sort)
          if [ "$blocked" != "$expected" ]; then
            echo "::error::the set of packages the libkvm.so link excludes has changed"
            echo "blocked now:"
            printf '%s\n' "$blocked"
            echo "expected:"
            printf '%s\n' "$expected"
            exit 1
          fi

          packages=$(go list ./... | grep -vxF "$blocked" | tr '\n' ' ')
          echo "Testing: $packages"
          echo "list=$packages" >> "$GITHUB_OUTPUT"

      - name: go test
        working-directory: server
        env:
          PACKAGES: ${{ steps.packages.outputs.list }}
        run: |
          # shellcheck disable=SC2086 # PACKAGES is a space-separated list of import paths.
          go test $PACKAGES

  kernel:
    name: Kernel tier 1
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Tier 2 is not wired here and cannot be on a GitHub-hosted runner as it
    # stands. The -azure kernel is built with CONFIG_USB_GADGET unset, so
    # libcomposite, every usb_f_*, raw_gadget and usbip-host are absent from
    # both linux-modules-azure and linux-modules-extra-azure; there is nothing
    # to install. Only vhci-hcd, configfs, bridge and veth survive, which is
    # exactly what this job runs. Running tier 2 in CI needs a nested KVM job whose
    # /dev/kvm has been checked in a real run rather than read about in the
    # docs, and until someone does that it is "make kernelint-tier2" locally.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Kernel tier 1
        # Root, because the tests load vhci_hcd and add links. Everything they
        # touch is inside a network namespace the script creates and deletes.
        run: sudo env "PATH=$PATH" scripts/kernelint.sh tier1

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        run: |
          npm install --global pnpm@11
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Lint
        working-directory: web
        # eslint exits non-zero on errors and zero on warnings, which is exactly
        # the policy wanted here. There are 16 warnings today, all
        # react-hooks/exhaustive-deps. Do not add --max-warnings: pinning the
        # count makes an unrelated change to any component fail this job.
        run: pnpm exec eslint src

      - name: Test
        working-directory: web
        # node --test over a glob, so a new *.test.ts file is picked up without
        # anyone remembering to add a script for it.
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build
